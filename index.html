<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaso SVSS · Decreto 185/2015</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1E2A38;
    --ink-soft:#2B3B4E;
    --paper:#F1ECE0;
    --paper-panel:#FAF7F0;
    --gold:#B8863B;
    --gold-soft:#E4CFA0;
    --ok:#3F7A5D;
    --err:#B4472F;
    --text:#23262B;
    --muted:#8B93A1;
    --line:#DDD5C2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', serif; }
  .app{ display:flex; min-height:100vh; max-width:1180px; margin:0 auto; }

  /* ---- Sidebar ---- */
  .sidebar{
    width:300px; flex-shrink:0;
    background:var(--ink);
    color:#EDE8DA;
    padding:28px 22px;
    position:relative;
  }
  .brand{ font-size:13px; letter-spacing:.02em; color:var(--gold-soft); margin-bottom:2px;}
  .brand-title{ font-family:'Fraunces', serif; font-size:22px; font-weight:600; margin:0 0 26px 0; color:#fff;}
  .repaso-btn{
    display:block; width:100%; text-align:left;
    background:var(--gold); color:var(--ink); border:none;
    font-family:'IBM Plex Sans'; font-weight:600; font-size:14px;
    padding:12px 14px; border-radius:3px; cursor:pointer; margin-bottom:28px;
  }
  .repaso-btn:hover{ background:#c99a4c; }
  .timeline-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#8592A3; margin-bottom:14px; }
  .timeline{ list-style:none; margin:0; padding:0; border-left:1px solid #3A4A5D; }
  .tl-item{ position:relative; padding:0 0 20px 20px; cursor:pointer; }
  .tl-item::before{
    content:''; position:absolute; left:-4.5px; top:3px; width:8px; height:8px;
    border-radius:50%; background:#5A6C80; border:2px solid var(--ink);
  }
  .tl-item.active::before{ background:var(--gold); }
  .tl-item.locked::before{ background:#3A4A5D; }
  .tl-range{ font-family:'IBM Plex Mono'; font-size:11px; color:#8592A3; }
  .tl-temas{ font-size:13px; color:#D9D2C2; margin-top:2px; }
  .tl-item.active .tl-temas{ color:#fff; }
  .tl-item.locked .tl-temas{ color:#5A6472; }
  .tl-tag{ display:inline-block; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); background:var(--gold-soft); padding:1px 6px; border-radius:2px; margin-top:5px;}

  /* ---- Main ---- */
  .main{ flex:1; padding:40px 48px; }
  .eyebrow{ color:var(--gold); font-size:13px; font-weight:600; margin-bottom:6px;}
  .page-title{ font-size:30px; margin:0 0 8px 0; }
  .page-sub{ color:var(--muted); margin-bottom:34px; max-width:60ch;}

  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px;}
  .card{ background:var(--paper-panel); border:1px solid var(--line); border-radius:4px; padding:20px; }
  .card h3{ margin:0 0 6px 0; font-size:17px; }
  .card p{ margin:0; color:var(--muted); font-size:13.5px; }

  .tema-block{ margin-bottom:38px; }
  .tema-heading{
    display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--ink);
    padding-bottom:8px; margin-bottom:18px;
  }
  .tema-heading h2{ font-size:19px; margin:0; }
  .tema-count{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--muted); }

  .q{ background:var(--paper-panel); border:1px solid var(--line); border-radius:4px; padding:18px 20px; margin-bottom:12px;}
  .q-num{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--gold); margin-bottom:6px; display:block;}
  .q-text{ font-size:15px; margin:0 0 12px 0; font-weight:500;}
  .opt{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:3px; margin-bottom:7px; cursor:pointer; font-size:14px;}
  .opt:hover{ border-color:var(--gold); }
  .opt input{ accent-color:var(--gold); }
  .opt.correct{ border-color:var(--ok); background:#EAF3EE; }
  .opt.incorrect{ border-color:var(--err); background:#F8EAE6; }

  .q-ficha{ font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:.02em; background:var(--gold-soft); color:var(--ink); padding:1px 7px; border-radius:2px; margin-left:8px; vertical-align:middle;}
  .dev-q{ background:var(--ink); color:#EDE8DA; border-radius:4px; padding:22px 24px; margin-bottom:16px;}
  .dev-q .q-ficha{ background:#3A4A5D; color:#EDE8DA; }
  .dev-q .q-num{ color:var(--gold-soft); }
  .dev-q textarea{ width:100%; min-height:80px; background:#28374A; color:#fff; border:1px solid #3A4A5D; border-radius:3px; padding:10px; font-family:inherit; margin-top:10px; resize:vertical;}
  .reveal-btn{ background:none; border:1px solid var(--gold-soft); color:var(--gold-soft); font-size:12.5px; padding:6px 12px; border-radius:3px; cursor:pointer; margin-top:10px;}
  .reveal-box{ margin-top:12px; font-size:13.5px; color:#D9D2C2; border-top:1px solid #3A4A5D; padding-top:10px; display:none;}
  .reveal-box.open{ display:block; }

  .submit-bar{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--line);}
  .btn{ background:var(--ink); color:#fff; border:none; padding:11px 22px; border-radius:3px; font-family:'IBM Plex Sans'; font-weight:600; font-size:14px; cursor:pointer;}
  .btn:hover{ background:var(--ink-soft); }
  .score{ font-family:'IBM Plex Mono'; font-size:14px; }

  .placeholder-flag{ display:inline-block; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--err); border:1px solid var(--err); padding:1px 6px; border-radius:2px; margin-bottom:10px;}

  .repaso-config{ background:var(--paper-panel); border:1px solid var(--line); border-radius:4px; padding:26px; max-width:480px;}
  .segmented{ display:flex; gap:8px; margin:14px 0 22px 0;}
  .seg-opt{ flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:3px; cursor:pointer; font-family:'IBM Plex Mono'; font-size:14px;}
  .seg-opt.sel{ border-color:var(--gold); background:var(--gold-soft); }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; padding:20px; }
    .timeline{ display:flex; overflow-x:auto; border-left:none; gap:14px; padding-bottom:6px; }
    .tl-item{ padding:0 0 0 0; min-width:150px; border-left:1px solid #3A4A5D; padding-left:12px; }
    .tl-item::before{ display:none; }
    .main{ padding:26px 22px; }
    .home-grid{ grid-template-columns:1fr; }
  }

  /* ---- Login ---- */
  .login-screen{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:var(--ink); padding:24px; }
  .login-box{ background:var(--paper-panel); border-radius:6px; padding:38px 34px; max-width:400px; width:100%; text-align:left; }
  .login-box .brand{ color:var(--gold); font-size:13px; margin-bottom:4px; }
  .login-box h1{ font-family:'Fraunces', serif; font-size:24px; margin:0 0 8px 0; }
  .login-box p{ color:var(--muted); font-size:14px; margin:0 0 20px 0; }
  .login-box input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:3px; font-family:'IBM Plex Sans'; font-size:15px; margin-bottom:14px; }
  .login-box input:focus{ outline:2px solid var(--gold); border-color:var(--gold); }

  /* ---- User badge ---- */
  .user-badge{ display:flex; align-items:center; justify-content:space-between; background:#28374A; border-radius:4px; padding:10px 12px; margin-bottom:22px; }
  .user-badge .u-name{ font-size:13px; color:#fff; font-weight:600; }
  .user-badge .u-switch{ font-size:11px; color:var(--gold-soft); text-decoration:none; cursor:pointer; }

  /* ---- Registro ---- */
  .reg-table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px; }
  .reg-table th{ text-align:left; font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:2px solid var(--ink); padding:8px 10px; }
  .reg-table td{ padding:9px 10px; border-bottom:1px solid var(--line); }
  .reg-table tr:hover td{ background:var(--paper-panel); }
  .reg-score{ font-family:'IBM Plex Mono'; }
  .reg-summary-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin:18px 0 30px 0; }
  .reg-summary-card{ background:var(--paper-panel); border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
  .reg-summary-card .u{ font-weight:600; font-size:14px; margin-bottom:4px;}
  .reg-summary-card .s{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--muted);}
  .reg-empty{ color:var(--muted); font-size:14px; padding:30px 0; }
  .reg-loading{ color:var(--muted); font-size:14px; padding:30px 0; }
</style>
</head>

<script>

  if(firebaseConfig.apiKey !== "TU_API_KEY"){

/* ===================== DATOS ===================== */
/* Semanas 1-3: contenido de MUESTRA (marcado como placeholder) para validar la estructura.
   El resto del cronograma se muestra "bloqueado" solo para visualizar el alcance completo. */

function sampleQuestions(temaLabel){
  const qs = [];
  for(let i=1;i<=10;i++){
    qs.push({
      text: `[Muestra] Pregunta ${i} de alta dificultad sobre "${temaLabel}" — se sustituirá por contenido real del Decreto 185/2015.`,
      options: ['Opción A (a definir)','Opción B (a definir)','Opción C (a definir)','Opción D (a definir)'],
      correct: 0
    });
  }
  return qs;
}
function fichaFromName(name){ return 'Ficha ' + name.split(' ')[0]; }

const weeks = [
  {
    id:'w1', range:'01/09 – 07/09', locked:false,
    temas:[
      { name:'2.1 Valoración y diagnóstico', ficha:'Ficha 2.1', questions:[
          { text:'Según el Anexo I del Decreto, ¿de qué administración es competencia la prestación del Servicio de valoración y diagnóstico de la dependencia, la discapacidad, la exclusión y la desprotección (ficha 2.1)?', options:['De competencia municipal, a través del Servicio Social de Base','De competencia foral (diputaciones forales)','Del Gobierno Vasco, de forma centralizada','Es una competencia compartida entre municipio y Gobierno Vasco a partes iguales'], correct:1 },
          { text:'¿Cuál es la población destinataria del servicio, en cuanto a "situación", según su ficha?', options:['Solo personas con dependencia ya reconocida','Solo personas mayores de 65 años','Toda la población','Únicamente personas ya usuarias de un servicio de atención secundaria'], correct:2 },
          { text:'¿Qué límite de edad establece la ficha 2.1 para acceder al servicio?', options:['Sin límites de edad','65 años o más','Entre 18 y 64 años','Entre 0 y 18 años'], correct:0 },
          { text:'¿En qué supuesto la propia ficha exime del requisito de empadronamiento en un municipio del Territorio Histórico?', options:['Cuando la persona solicitante sea mayor de 80 años','Cuando la intervención se oriente a atender situaciones de riesgo de desprotección o desamparo que afecten a personas menores de edad','Cuando la solicitud la presente un familiar y no la propia persona interesada','Nunca se exime este requisito, es siempre obligatorio'], correct:1 },
          { text:'Según la definición de su ficha, ¿qué facilita este servicio?', options:['La identificación y, en su caso, la gradación de las situaciones de dependencia, discapacidad, desprotección y exclusión','La concesión directa de la prestación económica vinculada al servicio','La gestión exclusiva de listas de espera de centros residenciales','La sustitución del Servicio Social de Base en la tramitación de expedientes'], correct:0 },
          { text:'Además de facilitar la identificación de esas situaciones, ¿hacia qué orienta este servicio a las personas solicitantes, según su ficha?', options:['Únicamente hacia servicios de competencia municipal','Hacia el servicio o la prestación económica, o hacia la combinación de servicios y/o prestaciones económicas, que mejor respondan a sus necesidades','Exclusivamente hacia recursos sanitarios de Osakidetza','Hacia cualquier recurso, sin condición alguna'], correct:1 },
          { text:'Esa orientación hacia un servicio, prestación económica o su combinación, según la ficha, se realiza...', options:['De forma automática en todos los casos, sin más trámite','Siempre que la persona cumpla los requisitos de acceso a los mismos','Solo si lo solicita expresamente por escrito ante el Gobierno Vasco','Únicamente cuando medie resolución judicial'], correct:1 },
          { text:'La letra a) de la definición de la ficha 2.1 dice que el servicio incluye "la valoración de las solicitudes o, en su caso, la valoración de..."', options:['...las situaciones comunicadas por otras instituciones en relación con posibles situaciones de dependencia, discapacidad, desprotección y/o exclusión','...las reclamaciones presentadas contra resoluciones de otros servicios','...las quejas ciudadanas sobre el funcionamiento del SVSS','...las solicitudes de prestaciones económicas ya concedidas'], correct:0 },
          { text:'¿Cuáles son las prestaciones de servicios sociales que recoge expresamente la ficha 2.1?', options:['Valoración y diagnóstico social especializados, y orientación','Valoración, diagnóstico y atención personal','Diagnóstico, orientación y mediación-intermediación','Valoración, orientación y transporte adaptado'], correct:0 },
          { text:'Como requisito de necesidad, la ficha 2.1 exige presentar indicios de poder encontrarse en situación de dependencia, discapacidad, desprotección o exclusión, en los términos definidos en...', options:['...los instrumentos comunes de valoración del riesgo y de las situaciones de necesidad','...el informe médico de Osakidetza','...la declaración de la renta del último ejercicio','...el certificado de empadronamiento histórico'], correct:0 },
        ],
        desarrollo:{ pregunta:'Según la propia ficha 2.1, explica qué dos actuaciones incluye este servicio (apartados a y b de su definición), a qué población se dirige, y en qué supuesto concreto se exime del requisito de empadronamiento.', puntos:['a) La valoración de las solicitudes o de las situaciones comunicadas por otras instituciones en relación con posibles situaciones de dependencia, discapacidad, desprotección y/o exclusión.','b) En su caso, la realización de diagnósticos sociales especializados y la orientación hacia los recursos idóneos del SVSS y/o la derivación a otros sistemas.','Población: toda la población, sin límites de edad.','Excepción al empadronamiento: cuando la intervención se oriente a atender situaciones de riesgo de desprotección o desamparo que afecten a personas menores de edad.'] } },
      { name:'2.2.1 Centro de día — limitaciones autonomía', ficha:'Ficha 2.2.1', questions:[
          { text:'El servicio o centro de día para atender necesidades derivadas de limitaciones en la autonomía (2.2.1) se define como un servicio de...', options:['Baja intensidad, de acceso directo sin prescripción técnica','Media y alta intensidad, de atención diurna, temporal o permanente','Exclusivamente de urgencia, de estancia máxima de 72 horas','Alta exigencia y baja intensidad de apoyo'], correct:1 },
          { text:'¿Qué garantiza este servicio durante las horas de apertura, según su ficha?', options:['Transporte adaptado gratuito para todas las personas usuarias','Presencia permanente de personal cuidador (y educativo en el 2º tipo), servicio médico/enfermería en su caso, y apoyo de equipo multidisciplinar','Alojamiento nocturno de emergencia','Gratuidad total del servicio sin copago'], correct:1 },
          { text:'¿Cuántos tipos de servicio o centro de día distingue la ficha 2.2.1 y a quién se dirige el "tipo 1"?', options:['Un único tipo, para toda la población sin distinción','Cuatro tipos: el tipo 1 para personas mayores en situación de dependencia; los tipos 2, 3 y 4 para personas con discapacidad o enfermedad mental crónica','Dos tipos: mayores y menores de edad','Tres tipos, organizados exclusivamente por grado de discapacidad'], correct:1 },
          { text:'Dentro de los tipos 2, 3 y 4 (discapacidad / enfermedad mental crónica), ¿cuál de estos NO es uno de los tres subtipos previstos?', options:['Centros de autonomía personal para personas con graves limitaciones físicas u orgánicas','Servicio o centro de día para personas con discapacidad intelectual y del desarrollo','Servicio o centro de día para personas con enfermedad mental crónica, de naturaleza sociosanitaria','Centro de día especializado exclusivamente en drogodependencias'], correct:3 },
          { text:'Para acceder al "tipo 1" (personas mayores en situación de dependencia), ¿qué puntuación en el BVD (Baremo de Valoración de la Dependencia) se exige con carácter general?', options:['Puntuación superior a 39 puntos','Puntuación entre 25 y 39 puntos','Puntuación igual o inferior a 25 puntos','No se exige puntuación mínima, basta con tener 65 años'], correct:0 },
          { text:'¿Cuál es el requisito de discapacidad o enfermedad para acceder al "tipo 2" del servicio (personas con discapacidad o enfermedad mental crónica)?', options:['Discapacidad reconocida en cualquier grado, sin porcentaje mínimo','Discapacidad superior al 60% o reconocimiento de dependencia; o diagnóstico de enfermedad mental crónica/trastorno mental grave y prolongado emitido por Osakidetza, o dependencia derivada de dicha enfermedad','Discapacidad igual o superior al 33%, como en el servicio ocupacional','Certificado de exclusión social emitido por Lanbide'], correct:1 },
          { text:'¿En qué rango de edad se sitúa la población destinataria del "tipo 2", y qué excepción existe?', options:['65 años o más, sin excepciones','Entre 18 y 64 años, salvo en el subtipo "centros de autonomía personal", donde no hay límite de edad','Entre 3 y 18 años, sin excepciones','Sin límite de edad en ningún subtipo'], correct:1 },
          { text:'¿Qué requisitos administrativos adicionales exige la ficha 2.2.1 para acceder al servicio?', options:['Empadronamiento de 12 meses continuados','Empadronamiento de 6 meses continuados','Ningún requisito administrativo adicional','Estar previamente valorado por Osakidetza con informe específico'], correct:2 },
          { text:'Entre los requisitos de necesidad de la ficha 2.2.1 se incluye "no precisar una asistencia sanitaria especializada y/o permanente fuera del alcance de la red de servicios sociales". ¿Qué otro requisito de necesidad exige la ficha?', options:['Requerir un apoyo de baja intensidad para las actividades de la vida diaria','Requerir un apoyo de media o alta intensidad para realizar actividades de la vida diaria','Disponer de vehículo adaptado propio','Haber agotado previamente la prestación económica vinculada al servicio'], correct:1 },
          { text:'¿Está sujeto a copago el servicio o centro de día del 2.2.1?', options:['No, es gratuito en todos los casos','Sí, el servicio está sujeto a copago','Solo si la persona usuaria supera los 39 puntos en el BVD','Solo para el subtipo de enfermedad mental crónica'], correct:1 },
        ],
        desarrollo:{ pregunta:'Compara los tres subtipos del servicio de centro de día para personas con discapacidad o enfermedad mental crónica (tipos 2, 3 y 4): a qué población se dirige cada uno y en cuál de ellos no se aplica límite de edad, razonando por qué.', puntos:['Subtipo a) Centros de autonomía personal: personas con graves limitaciones físicas u orgánicas — es el único subtipo sin límite de edad, porque este tipo de limitación no está ligada a un tramo etario concreto.','Subtipo b) Centro de día para discapacidad intelectual y del desarrollo: población de 18 a 64 años.','Subtipo c) Centro de día para enfermedad mental crónica, de naturaleza sociosanitaria: también de 18 a 64 años, con diagnóstico de Osakidetza.','En los subtipos b) y c) el límite 18-64 responde a que a partir de 65 años la persona pasaría a los recursos propios de personas mayores (tipo 1).'] } },
    ]
  },
  {
    id:'w2', range:'08/09 – 14/09', locked:false,
    temas:[
      { name:'2.2.2 Centro ocupacional', ficha:'Ficha 2.2.2', questions:[
          { text:'¿Cuál es el objetivo general del servicio o centro ocupacional (2.2.2), según su ficha?', options:['Favorecer la participación activa de las personas con discapacidad y/o enfermedad mental en la vida social, mediante programas de desarrollo personal en torno a la actividad productiva, para favorecer su acceso al empleo cuando resulte posible','Ofrecer alojamiento residencial permanente','Sustituir al centro de día para limitaciones en la autonomía','Prestar exclusivamente formación reglada universitaria'], correct:0 },
          { text:'¿Cuál de estos SÍ se apoya, favorece o promueve desde este servicio, según su ficha?', options:['La adquisición y mejora de habilidades adaptativas, ocupacionales y sociales necesarias para la autonomía personal y la integración sociolaboral','La contratación laboral indefinida garantizada','La exención total de cualquier valoración de seguimiento','El traslado obligatorio a un centro especial de empleo'], correct:0 },
          { text:'¿Cómo se plantea este servicio dentro del itinerario de la persona usuaria, según su ficha?', options:['Únicamente como una etapa final e irreversible','Como un primer paso en el itinerario personal de inclusión laboral, o como alternativa definitiva para personas con graves dificultades de inclusión laboral','Como sustituto obligatorio de cualquier centro de día','Exclusivamente como medida sancionadora'], correct:1 },

          { text:'¿Cuál de las siguientes NO es una de las funciones de primera atención de urgencia que recoge la ficha 2.6?', options:['Desplazarse al lugar en el que se haya producido la urgencia para atender in situ a las personas afectadas','Detectar in situ las situaciones de necesidad','Conceder de forma directa una prestación económica vinculada al servicio','Derivar la atención del caso, cuando resulte necesario, a los servicios que correspondan'], correct:2 },

          { text:'Dentro de la población destinataria, ¿qué situaciones se agrupan bajo "desprotección sobrevenida"?', options:['Solo el desempleo reciente','Situaciones de pérdida y/o desorientación, de abandono o ausencia sobrevenida de la persona cuidadora, y de violencia de género o doméstica','Únicamente conflictos vecinales','Solo situaciones de impago de alquiler'], correct:1 },

/* ===================== USUARIO (login simple por nombre) ===================== */
const USER_KEY = 'repaso-svss-usuario';
function loadUsername(){
  try{ return localStorage.getItem(USER_KEY) || null; }catch(e){ return null; }
}
function saveUsername(name){
  try{ localStorage.setItem(USER_KEY, name); }catch(e){}
}
let currentUser = loadUsername();

function doLogin(){
  const input = document.getElementById('login-name-input');
  const name = input ? input.value.trim() : '';
  if(!name) return;
  currentUser = name;
  saveUsername(name);
  progress = loadProgress(name);
  state.view = 'home';
  render();
}
function logout(){
  try{ localStorage.removeItem(USER_KEY); }catch(e){}
  currentUser = null;
  progress = { weeks:{} };
  state = { view:'login', weekId:null, answers:{}, submitted:false, repasoCount:10, repasoSelected:new Set(weeks.filter(w=>!w.locked).map(w=>w.id)), repasoSet:null, repasoAnswers:{}, repasoSubmitted:false, registroData:null, registroLoading:false, registroError:null };
  render();
}

/* ===================== PERSISTENCIA (localStorage, por usuario) ===================== */
function progressKey(user){ return 'repaso-svss-progreso__' + user; }
function loadProgress(user){
  try{
    const raw = localStorage.getItem(progressKey(user));
    return raw ? JSON.parse(raw) : { weeks:{} };
  }catch(e){ return { weeks:{} }; }
}
function saveProgress(){
  if(!currentUser) return;
  try{ localStorage.setItem(progressKey(currentUser), JSON.stringify(progress)); }catch(e){ /* almacenamiento no disponible */ }
}
let progress = currentUser ? loadProgress(currentUser) : { weeks:{} };
function clearProgress(){
  if(confirm('¿Seguro que quieres borrar TU progreso guardado en este navegador? Esta acción no se puede deshacer. (El registro compartido con las demás personas no se ve afectado.)')){
    progress = { weeks:{} };
    saveProgress();
    state.answers = {}; state.submitted = false;
    render();
  }
}

/* ===================== ESTADO ===================== */
let state = { view: currentUser ? 'home' : 'login', weekId:null, answers:{}, submitted:false, repasoCount:10, repasoSelected:new Set(weeks.filter(w=>!w.locked).map(w=>w.id)), repasoSet:null, repasoAnswers:{}, repasoSubmitted:false, registroData:null, registroLoading:false, registroError:null };

/* ===================== HELPERS ===================== */
function flatQuestionsFromWeek(w){
  const out = [];
  w.temas.forEach(t => t.questions && t.questions.forEach((q,i)=> out.push({...q, tema:t.name, ficha:t.ficha, qid:t.name+'-'+i})));
  return out;
}
function allAvailableQuestions(selectedIds){
  let out = [];
  weeks.filter(w=>!w.locked && selectedIds.has(w.id)).forEach(w=> out = out.concat(flatQuestionsFromWeek(w).map(q=>({...q, week:w.range}))));
  return out;
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  if(state.view === 'login'){
    app.innerHTML = renderLogin();
    setTimeout(()=>{ const el = document.getElementById('login-name-input'); if(el) el.focus(); }, 0);
    return;
  }
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand">DECRETO 185/2015 · SVSS</div>
      <h1 class="brand-title">Repaso semanal</h1>
      <div class="user-badge">
        <span class="u-name">👤 ${currentUser}</span>
        <a class="u-switch" href="#" onclick="logout();return false;">Cambiar</a>
      </div>
      <button class="repaso-btn" onclick="goRepaso()">↻ Modo repaso (10 / 15 / 20 preg.)</button>
      <button class="repaso-btn" style="background:#28374A; color:#fff;" onclick="goRegistro()">📋 Registro de todo el equipo</button>
      <div class="timeline-label">Cronograma</div>
      <ul class="timeline">
        ${weeks.map(w => {
          const p = progress.weeks[w.id];
          const doneBadge = (p && p.submitted) ? `<span class="tl-tag" style="background:var(--ok);color:#fff;">${p.correct}/${p.total} guardado</span>` : '';
          return `
          <li class="tl-item ${state.weekId===w.id?'active':''} ${w.locked?'locked':''}" onclick="${w.locked? '' : `openWeek('${w.id}')`}">
            <div class="tl-range">${w.range}</div>
            <div class="tl-temas">${w.special ? w.special : w.temas.map(t=>t.name).join(' · ')}</div>
            ${w.locked ? '<span class="tl-tag">Pendiente</span>' : doneBadge}
          </li>
        `;}).join('')}
      </ul>
      <div style="margin-top:22px;">
        <a href="#" onclick="clearProgress();return false;" style="color:#67728A; font-size:11px; text-decoration:none;">Borrar mi progreso guardado</a>
      </div>
    </div>
    <div class="main">${renderMain()}</div>
  `;
}

function renderLogin(){
  return `
    <div class="login-screen">
      <div class="login-box">
        <div class="brand">DECRETO 185/2015 · SVSS</div>
        <h1 class="serif">¿Cómo te llamas?</h1>
        <p>Escribe tu nombre para guardar tu progreso y que aparezca en el registro compartido del equipo.</p>
        <input id="login-name-input" type="text" placeholder="Ej. Ane, Jon, Maite..." maxlength="40" onkeydown="if(event.key==='Enter'){ doLogin(); }">
        <button class="btn" style="width:100%;" onclick="doLogin()">Entrar</button>
      </div>
    </div>
  `;
}

function renderMain(){
  if(state.view==='home') return renderHome();
  if(state.view==='week') return renderWeek();
  if(state.view==='repaso-config') return renderRepasoConfig();
  if(state.view==='repaso-quiz') return renderRepasoQuiz();
  if(state.view==='registro') return renderRegistro();
  return '';
}

function renderHome(){
  const completedIds = Object.keys(progress.weeks).filter(id => progress.weeks[id].submitted);
  const completedCount = completedIds.length;
  let avgText = '—';
  if(completedCount > 0){
    const totalCorrect = completedIds.reduce((s,id)=> s + progress.weeks[id].correct, 0);
    const totalQ = completedIds.reduce((s,id)=> s + progress.weeks[id].total, 0);
    avgText = Math.round((totalCorrect/totalQ)*100) + '%';
  }
  return `
    <div class="eyebrow">Cronograma completo</div>
    <h2 class="page-title serif">Bienvenida al repaso semanal</h2>
    <p class="page-sub">Cada semana: 20 preguntas tipo test (10 por tema, alta dificultad, 4 opciones) + 1 pregunta de desarrollo por tema, basadas exclusivamente en el recuadro de cada ficha del Anexo I del Decreto 185/2015. El Modo repaso te deja elegir qué semanas mezclar y cuántas preguntas responder (10/15/20). Tu progreso se guarda automáticamente en este navegador, así que puedes cerrar la pestaña y seguir donde lo dejaste.</p>
    <div class="home-grid">
      <div class="card"><h3>17</h3><p>semanas con contenido real, verificado ficha a ficha contra el Anexo I</p></div>
      <div class="card"><h3>${completedCount}</h3><p>semanas que ya has completado en este navegador</p></div>
      <div class="card"><h3>${avgText}</h3><p>tu acierto medio en las semanas completadas</p></div>
      <div class="card"><h3>10/15/20</h3><p>preguntas configurables en el Modo repaso</p></div>
    </div>
  `;
}

function renderWeek(){
  const w = weeks.find(x=>x.id===state.weekId);
  let html = `<div class="eyebrow">Semana ${w.range}</div><h2 class="page-title serif">Quiz semanal</h2>`;
  if(w.sample) html += `<div class="placeholder-flag">Contenido de muestra — pendiente de redacción final</div>`;

  w.temas.forEach((t, ti) => {
    html += `<div class="tema-block"><div class="tema-heading"><h2>${t.name}</h2><span class="tema-count">10 preguntas</span></div>`;
    t.questions.forEach((q, qi) => {
      const key = t.name+'-'+qi;
      const chosen = state.answers[key];
      html += `<div class="q"><span class="q-num">P${qi+1}<span class="q-ficha">${t.ficha}</span></span><p class="q-text">${q.text}</p>`;
      q.options.forEach((opt, oi) => {
        let cls = 'opt';
        if(state.submitted){
          if(oi===q.correct) cls += ' correct';
          else if(chosen===oi) cls += ' incorrect';
        }
        html += `<label class="${cls}"><input type="radio" name="${key}" ${chosen===oi?'checked':''} ${state.submitted?'disabled':''} onchange="setAnswer('${key}',${oi})"> ${opt}</label>`;
      });
      html += `</div>`;
    });
    html += `<div class="dev-q"><span class="q-num">Desarrollo<span class="q-ficha">${t.ficha}</span></span><p class="q-text" style="color:#fff">${t.desarrollo.pregunta}</p>
      <textarea placeholder="Escribe aquí tu respuesta..."></textarea>
      <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('open')">Ver puntos clave</button>
      <div class="reveal-box"><ul>${t.desarrollo.puntos.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    </div>`;
  });

  const total = flatQuestionsFromWeek(w).length;
  const correct = flatQuestionsFromWeek(w).filter(q => state.answers[q.qid]===q.correct).length;

  html += `<div class="submit-bar">
    ${state.submitted
      ? `<span class="score">Resultado: ${correct} / ${total} correctas</span><button class="btn" onclick="resetWeek()">Repetir</button>`
      : `<span class="score">${Object.keys(state.answers).length} / ${total} respondidas</span><button class="btn" onclick="submitWeek()">Corregir</button>`
    }
  </div>`;
  return html;
}

function renderRepasoConfig(){
  const availableCount = allAvailableQuestions(state.repasoSelected).length;
  const noneSelected = state.repasoSelected.size===0;
  return `
    <div class="eyebrow">Modo repaso</div>
    <h2 class="page-title serif">Elige qué semanas y cuántas preguntas</h2>
    <p class="page-sub">Marca las semanas que quieres incluir en la mezcla — solo entran las que ya tienen contenido. Luego elige cuántas preguntas quieres responder.</p>
    <div class="repaso-config" style="max-width:560px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;">Semanas a incluir</span>
        <span style="font-size:12px;">
          <a href="#" onclick="selectAllWeeks(true);return false;" style="color:var(--gold); text-decoration:none; margin-right:10px;">Todas</a>
          <a href="#" onclick="selectAllWeeks(false);return false;" style="color:var(--muted); text-decoration:none;">Ninguna</a>
        </span>
      </div>
      <div style="max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:3px; margin-bottom:22px;">
        ${weeks.map(w => `
          <label style="display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-bottom:1px solid var(--line); cursor:${w.locked?'default':'pointer'}; opacity:${w.locked?0.45:1};">
            <input type="checkbox" style="margin-top:3px; accent-color:var(--gold);" ${w.locked?'disabled':''} ${state.repasoSelected.has(w.id)?'checked':''} onchange="toggleRepasoWeek('${w.id}')">
            <span>
              <span style="font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--muted); display:block;">${w.range}${w.locked?' · sin contenido todavía':''}</span>
              <span style="font-size:13.5px;">${w.special ? w.special : w.temas.map(t=>t.name).join(' · ')}</span>
            </span>
          </label>
        `).join('')}
      </div>
      <div class="segmented">
        ${[10,15,20].map(n=>`<div class="seg-opt ${state.repasoCount===n?'sel':''}" onclick="setRepasoCount(${n})">${n} preguntas</div>`).join('')}
      </div>
      <p style="font-size:12.5px; color:var(--muted); margin:-8px 0 16px 0;">${availableCount} preguntas disponibles en las semanas seleccionadas.</p>
      <button class="btn" onclick="startRepaso()" ${(noneSelected || availableCount===0)?'disabled style="opacity:.5;cursor:not-allowed;"':''}>Generar repaso</button>
    </div>
  `;
}

function renderRepasoQuiz(){
  const set = state.repasoSet;
  let correct = set.filter(q => state.repasoAnswers[q.qid]===q.correct).length;
  let html = `<div class="eyebrow">Modo repaso · ${set.length} preguntas</div><h2 class="page-title serif">Repaso mezclado</h2>`;
  set.forEach((q, i) => {
    const chosen = state.repasoAnswers[q.qid];
    html += `<div class="q"><span class="q-num">P${i+1} · ${q.week}<span class="q-ficha">${q.ficha}</span></span><p class="q-text">${q.text}</p>`;
    q.options.forEach((opt, oi) => {
      let cls = 'opt';
      if(state.repasoSubmitted){
        if(oi===q.correct) cls += ' correct';
        else if(chosen===oi) cls += ' incorrect';
      }
      html += `<label class="${cls}"><input type="radio" name="r-${q.qid}" ${chosen===oi?'checked':''} ${state.repasoSubmitted?'disabled':''} onchange="setRepasoAnswer('${q.qid}',${oi})"> ${opt}</label>`;
    });
    html += `</div>`;
  });
  html += `<div class="submit-bar">
    ${state.repasoSubmitted
      ? `<span class="score">Resultado: ${correct} / ${set.length} correctas</span><button class="btn" onclick="goRepaso()">Nuevo repaso</button>`
      : `<span class="score">${Object.keys(state.repasoAnswers).length} / ${set.length} respondidas</span><button class="btn" onclick="submitRepaso()">Corregir</button>`
    }
  </div>`;
  return html;
}

/* ===================== ACCIONES ===================== */
function openWeek(id){
  state.view='week'; state.weekId=id;
  const saved = progress.weeks[id];
  if(saved){ state.answers = {...saved.answers}; state.submitted = !!saved.submitted; }
  else { state.answers={}; state.submitted=false; }
  render();
}
function setAnswer(key, oi){
  state.answers[key]=oi;
  progress.weeks[state.weekId] = { ...progress.weeks[state.weekId], answers: state.answers, submitted: state.submitted };
  saveProgress();
  render();
}
function submitWeek(){
  state.submitted=true;
  const w = weeks.find(x=>x.id===state.weekId);
  const total = flatQuestionsFromWeek(w).length;
  const correct = flatQuestionsFromWeek(w).filter(q => state.answers[q.qid]===q.correct).length;
  progress.weeks[state.weekId] = { answers: state.answers, submitted:true, correct, total, date: new Date().toISOString() };
  saveProgress();
  if(firebaseReady && currentUser){
    const temaNames = w.temas.map(t=>t.name).join(' · ');
    db.collection('resultados').doc(currentUser + '__' + state.weekId).set({
      name: currentUser,
      weekId: state.weekId,
      weekRange: w.range,
      temaNames: temaNames,
      correct: correct,
      total: total,
      timestampMillis: Date.now()
    }).catch(err => console.warn('No se pudo guardar en el registro compartido:', err));
  }
  render();
}
function resetWeek(){
  state.answers={}; state.submitted=false;
  delete progress.weeks[state.weekId];
  saveProgress();
  render();
}

function goRegistro(){
  state.view = 'registro';
  if(!firebaseReady){ render(); return; }
  state.registroLoading = true;
  state.registroError = null;
  render();
  db.collection('resultados').get().then(snap => {
    const rows = [];
    snap.forEach(doc => rows.push(doc.data()));
    state.registroData = rows;
    state.registroLoading = false;
    render();
  }).catch(err => {
    state.registroLoading = false;
    state.registroError = 'No se pudo cargar el registro compartido: ' + err.message;
    render();
  });
}

function renderRegistro(){
  let html = `<div class="eyebrow">Registro compartido</div><h2 class="page-title serif">Progreso de todo el equipo</h2>`;

  if(!firebaseReady){
    html += `<p class="page-sub">El registro compartido todavía no está activado. Hay que configurar el proyecto de Firebase (variable <code>firebaseConfig</code> al inicio del archivo) para que los resultados de todas las personas se guarden en la nube y se vean aquí.</p>`;
    return html;
  }
  if(state.registroLoading){
    html += `<p class="reg-loading">Cargando resultados de todo el equipo…</p>`;
    return html;
  }
  if(state.registroError){
    html += `<p class="reg-empty">${state.registroError}</p>`;
    return html;
  }
  const rows = state.registroData || [];
  if(rows.length===0){
    html += `<p class="reg-empty">Todavía no hay resultados guardados. En cuanto alguien corrija una semana, aparecerá aquí.</p>`;
    return html;
  }

  const byUser = {};
  rows.forEach(r => {
    if(!byUser[r.name]) byUser[r.name] = { weeksCount:0, correct:0, total:0 };
    byUser[r.name].weeksCount += 1;
    byUser[r.name].correct += r.correct;
    byUser[r.name].total += r.total;
  });
  html += `<div class="reg-summary-grid">`;
  Object.keys(byUser).sort().forEach(name => {
    const u = byUser[name];
    const pct = u.total>0 ? Math.round((u.correct/u.total)*100) : 0;
    html += `<div class="reg-summary-card"><div class="u">${name}</div><div class="s">${u.weeksCount} semana(s) resueltas · ${pct}% de acierto</div></div>`;
  });
  html += `</div>`;

  const sorted = [...rows].sort((a,b) => (b.timestampMillis||0) - (a.timestampMillis||0));
  html += `<table class="reg-table"><thead><tr><th>Usuario</th><th>Semana</th><th>Puntuación</th><th>%</th><th>Fecha</th></tr></thead><tbody>`;
  sorted.forEach(r => {
    const pct = r.total>0 ? Math.round((r.correct/r.total)*100) : 0;
    const dateStr = r.timestampMillis ? new Date(r.timestampMillis).toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    html += `<tr><td>${r.name}</td><td>${r.weekRange}${r.temaNames ? ' · ' + r.temaNames : ''}</td><td class="reg-score">${r.correct}/${r.total}</td><td class="reg-score">${pct}%</td><td>${dateStr}</td></tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function goRepaso(){ state.view='repaso-config'; render(); }
function setRepasoCount(n){ state.repasoCount=n; render(); }
function toggleRepasoWeek(id){
  if(state.repasoSelected.has(id)) state.repasoSelected.delete(id); else state.repasoSelected.add(id);
  render();
}
function selectAllWeeks(all){
  state.repasoSelected = all ? new Set(weeks.filter(w=>!w.locked).map(w=>w.id)) : new Set();
  render();
}
function startRepaso(){
  const pool = shuffle(allAvailableQuestions(state.repasoSelected));
  state.repasoSet = pool.slice(0, Math.min(state.repasoCount, pool.length));
  state.repasoAnswers = {};
  state.repasoSubmitted = false;
  state.view = 'repaso-quiz';
  render();
}
function setRepasoAnswer(qid, oi){ state.repasoAnswers[qid]=oi; render(); }
function submitRepaso(){ state.repasoSubmitted=true; render(); }

render();
</script>
